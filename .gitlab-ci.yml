image: iqrftech/debian-c-builder:debian-trixie-amd64

stages:
  - test
  - build-packages
  - deploy-docs

.ssh-template: &ssh-template
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

abi-check:
  stage: test
  variables:
    # Release tags are required to find the ABI baseline
    GIT_DEPTH: 0
  script:
    - .gitlab/ci/abi-check.sh
  artifacts:
    when: always
    paths:
      - abi-report/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

fuzz:
  stage: test
  variables:
    FUZZ_TIME: 60
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends clang libclang-rt-dev
  script:
    - make fuzz
    - ctest --test-dir build-fuzz/fuzz --output-on-failure
    - |
      for target in CdcProtocol Hdlc SpiProtocol TrInfo; do
        mkdir -p "fuzz-artifacts/${target}" "fuzz-corpus/${target}"
        build-fuzz/bin/fuzz_${target} -max_total_time="${FUZZ_TIME}" -print_final_stats=1 \
          -artifact_prefix="fuzz-artifacts/${target}/" "fuzz-corpus/${target}" "fuzz/corpus/${target}"
      done
  artifacts:
    when: on_failure
    paths:
      - fuzz-artifacts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-docs:
  stage: deploy-docs
  environment:
    name: doxygen_${VERSION}
    url: https://apidocs.iqrf.org/libiqrf/${VERSION}
  script:
    - ssh www-deploy@icinga.iqrf.org "rm -rf /data/nginx/apidocs/cpp/libiqrf/${VERSION}/*"
    - ssh www-deploy@icinga.iqrf.org "mkdir -p /data/nginx/apidocs/cpp/libiqrf/${VERSION}"
    - rsync -hrvz --delete -e ssh docs/doxygen/html/* www-deploy@icinga.iqrf.org:/data/nginx/apidocs/cpp/libiqrf/${VERSION}
  needs:
    - coverage
  only:
    - master
    - /^v\d+\.\d+\.\d+$/
  variables:
    VERSION: $CI_COMMIT_REF_NAME
  <<: *ssh-template

include:
  - template: Security/SAST.gitlab-ci.yml
  # Tests
  - component: gitlab.iqrf.org/open-source/gitlab-ci-components/test-cpp-ctest-coverage@master
    inputs:
      job_name: coverage
      cmake_options: '-DBUILD_DOCS=ON'
      ctest_options: '--exclude-regex "_GPIO$"'
      distributions:
        - debian-bookworm
        - debian-trixie
      artifact_paths:
        - docs/doxygen/html
      project_dir: '.'
  # Packages
  - component: gitlab.iqrf.org/open-source/gitlab-ci-components/build-jsonnnet-deb-packages@master
    inputs:
      job_name: build-jsonnet
      stage: build-packages
  - component: gitlab.iqrf.org/open-source/gitlab-ci-components/trigger-build-jobs-deb-packages@master
    inputs:
      job_name: trigger-build-deb-packages
      stage: build-packages
      jsonnet_build_job: build-jsonnet
